name: Build x86_64 QEMU-Wasm

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-x86_64-wasm:
    name: Build qemu-system-x86_64.wasm
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Emscripten toolchain image
        run: docker build --tag qemu-wasm-build .

      - name: Build x86_64 system emulator
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/qemu-wasm-out"
          docker run --rm \
            --init \
            -v "$GITHUB_WORKSPACE:/qemu" \
            -v "$RUNNER_TEMP/qemu-wasm-out:/out" \
            qemu-wasm-build \
            bash -c '
              set -euo pipefail

              source /emsdk/emsdk_env.sh
              command -v emcc
              command -v emconfigure
              command -v emmake

              EXTRA_CFLAGS="-O3 -g -Wno-error=unused-command-line-argument -Wno-unused-command-line-argument -matomics -mbulk-memory -DNDEBUG -DG_DISABLE_ASSERT -D_GNU_SOURCE"
              EXTRA_LDFLAGS="-L/build/target/lib -sASYNCIFY=1 -pthread -sPROXY_TO_PTHREAD=1 -sFORCE_FILESYSTEM -sALLOW_TABLE_GROWTH -sTOTAL_MEMORY=2300MB -sWASM_BIGINT -sMALLOC=mimalloc --js-library=/build/node_modules/xterm-pty/emscripten-pty.js -sEXPORT_ES6=1 -sASYNCIFY_IMPORTS=ffi_call_js -sEXPORTED_RUNTIME_METHODS=getTempRet0,setTempRet0,addFunction,removeFunction,TTY,FS"

              export CFLAGS="$EXTRA_CFLAGS"
              export CXXFLAGS="$EXTRA_CFLAGS"
              export LDFLAGS="$EXTRA_LDFLAGS"

              emconfigure /qemu/configure \
                --static \
                --target-list=x86_64-softmmu \
                --cpu=wasm32 \
                --cross-prefix= \
                --without-default-features \
                --enable-system \
                --with-coroutine=fiber \
                --enable-virtfs \
                --extra-cflags="$EXTRA_CFLAGS" \
                --extra-cxxflags="$EXTRA_CFLAGS" \
                --extra-ldflags="$EXTRA_LDFLAGS"

              # Emscripten warns about these flags and QEMU treats warnings as
              # errors in parts of the generated build rules.
              if [ -f /build/build.ninja ]; then
                sed -i -E "s/[[:space:]]-fno-pie([[:space:]]|$)/ /g; s/[[:space:]]-no-pie([[:space:]]|$)/ /g" /build/build.ninja
              fi

              emmake make -j"$(nproc)" qemu-system-x86_64

              echo "Emscripten build outputs:"
              find /build -maxdepth 1 -type f -name "qemu-system-x86_64*" -printf "%f %s bytes\n" | sort

              JS=""
              WASM=""
              WORKER=""
              for candidate in /build/qemu-system-x86_64.js /build/qemu-system-x86_64; do
                if [ -s "$candidate" ]; then JS="$candidate"; break; fi
              done
              for candidate in /build/qemu-system-x86_64.wasm; do
                if [ -s "$candidate" ]; then WASM="$candidate"; break; fi
              done
              for candidate in /build/qemu-system-x86_64.worker.js /build/qemu-system-x86_64.worker.mjs; do
                if [ -s "$candidate" ]; then WORKER="$candidate"; break; fi
              done

              test -n "$JS" || { echo "qemu-system-x86_64 JS output not found"; exit 1; }
              test -n "$WASM" || { echo "qemu-system-x86_64 WASM output not found"; exit 1; }

              cp "$JS" /out/qemu-system-x86_64.js
              cp "$WASM" /out/qemu-system-x86_64.wasm
              if [ -n "$WORKER" ]; then
                cp "$WORKER" /out/qemu-system-x86_64.worker.js
              fi
            '

      - name: Verify artifacts
        run: |
          set -euo pipefail
          ls -lh "$RUNNER_TEMP/qemu-wasm-out"
          test -s "$RUNNER_TEMP/qemu-wasm-out/qemu-system-x86_64.js"
          test -s "$RUNNER_TEMP/qemu-wasm-out/qemu-system-x86_64.wasm"

      - name: Upload x86_64 WASM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qemu-system-x86_64-wasm
          path: ${{ runner.temp }}/qemu-wasm-out/
          if-no-files-found: error
          retention-days: 14
