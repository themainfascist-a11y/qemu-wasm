name: Build x86_64 QEMU-Wasm

on:
  push:
    branches: [master, browser-graphics]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-x86_64-wasm:
    name: Build qemu-system-x86_64 graphical WASM
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Emscripten toolchain image
        run: docker build --tag qemu-wasm-build .

      - name: Build x86_64 system emulator
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/qemu-wasm-out"
          docker run --rm \
            --init \
            -v "$GITHUB_WORKSPACE:/qemu" \
            -v "$RUNNER_TEMP/qemu-wasm-out:/out" \
            qemu-wasm-build \
            bash -c '
              set -euo pipefail
              source /emsdk/emsdk_env.sh
              command -v emcc
              command -v emconfigure
              command -v emmake
              emcc --version

              EXTRA_CFLAGS="-O3 -g -Wno-error=unused-command-line-argument -Wno-unused-command-line-argument -matomics -mbulk-memory -DNDEBUG -DG_DISABLE_ASSERT -D_GNU_SOURCE -sUSE_SDL=2 -sOFFSCREENCANVAS_SUPPORT=1"
              EXTRA_LDFLAGS="-L/build/target/lib -sUSE_SDL=2 -sOFFSCREENCANVAS_SUPPORT=1 -sASYNCIFY=1 -pthread -sPROXY_TO_PTHREAD=1 -sFORCE_FILESYSTEM -sALLOW_TABLE_GROWTH -sTOTAL_MEMORY=2300MB -sWASM_BIGINT -sMALLOC=mimalloc -sEXPORT_ES6=1 -sASYNCIFY_IMPORTS=ffi_call_js -sEXPORTED_RUNTIME_METHODS=getTempRet0,setTempRet0,addFunction,removeFunction,TTY,FS"

              export CFLAGS="$EXTRA_CFLAGS"
              export CXXFLAGS="$EXTRA_CFLAGS"
              export LDFLAGS="$EXTRA_LDFLAGS"

              emconfigure /qemu/configure \
                --static \
                --target-list=x86_64-softmmu \
                --cpu=wasm32 \
                --cross-prefix= \
                --without-default-features \
                --enable-system \
                --enable-sdl \
                --with-coroutine=fiber \
                --enable-virtfs \
                --extra-cflags="$EXTRA_CFLAGS" \
                --extra-cxxflags="$EXTRA_CFLAGS" \
                --extra-ldflags="$EXTRA_LDFLAGS"

              if [ -f /build/build.ninja ]; then
                sed -i -E "s/[[:space:]]-fno-pie([[:space:]]|$)/ /g; s/[[:space:]]-no-pie([[:space:]]|$)/ /g" /build/build.ninja
              fi

              emmake make -j"$(nproc)" qemu-system-x86_64

              test -s /build/qemu-system-x86_64.js
              test -s /build/qemu-system-x86_64.wasm
              cp /build/qemu-system-x86_64.js /out/qemu-system-x86_64.js
              cp /build/qemu-system-x86_64.wasm /out/qemu-system-x86_64.wasm
              if [ -s /build/qemu-system-x86_64.worker.js ]; then cp /build/qemu-system-x86_64.worker.js /out/; fi
            '

      - name: Build sample x86_64 guest image
        run: docker build --output=type=local,dest="$RUNNER_TEMP/qemu-wasm-pack" ./examples/x86_64/image

      - name: Package guest assets
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/qemu-wasm-pack/pc-bios"
          cp pc-bios/bios-256k.bin "$RUNNER_TEMP/qemu-wasm-pack/pc-bios/"
          cp pc-bios/vgabios-stdvga.bin "$RUNNER_TEMP/qemu-wasm-pack/pc-bios/"
          cp pc-bios/kvmvapic.bin "$RUNNER_TEMP/qemu-wasm-pack/pc-bios/"
          cp pc-bios/linuxboot_dma.bin "$RUNNER_TEMP/qemu-wasm-pack/pc-bios/"
          docker run --rm \
            -v "$RUNNER_TEMP/qemu-wasm-pack:/pack:ro" \
            -v "$RUNNER_TEMP/qemu-wasm-out:/out" \
            qemu-wasm-build \
            bash -c '/emsdk/upstream/emscripten/tools/file_packager.py /out/qemu-system-x86_64.data --preload /pack > /out/load.js'

      - name: Assemble browser demo
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/qemu-wasm-out/htdocs"
          cp examples/x86_64/src/htdocs/index.html "$RUNNER_TEMP/qemu-wasm-out/htdocs/"
          cp examples/x86_64/src/htdocs/module.js "$RUNNER_TEMP/qemu-wasm-out/htdocs/"
          cp examples/x86_64/src/htdocs/vendor/xterm.css "$RUNNER_TEMP/qemu-wasm-out/htdocs/" 2>/dev/null || true

      - name: Verify artifacts
        run: |
          set -euo pipefail
          find "$RUNNER_TEMP/qemu-wasm-out" -maxdepth 2 -type f -printf '%P %s bytes\n' | sort
          test -s "$RUNNER_TEMP/qemu-wasm-out/qemu-system-x86_64.js"
          test -s "$RUNNER_TEMP/qemu-wasm-out/qemu-system-x86_64.wasm"
          test -s "$RUNNER_TEMP/qemu-wasm-out/qemu-system-x86_64.data"
          test -s "$RUNNER_TEMP/qemu-wasm-out/load.js"

      - name: Upload x86_64 WASM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qemu-system-x86_64-graphical-wasm
          path: ${{ runner.temp }}/qemu-wasm-out/
          if-no-files-found: error
          retention-days: 14
